<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="100" cy="100" r="75" fill="url(#glow-grad)" filter="url(#glow)" opacity="0.5" />

  <!-- Outer rounded hex/shield -->
  <rect x="25" y="25" width="150" height="150" rx="38" fill="#090D16" stroke="url(#gradient-bg)" stroke-width="3" />
  
  <!-- Inner subtle grid lines -->
  <path d="M60 28v144M100 28v144M140 28v144" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" />
  <path d="M28 60h144M28 100h144M28 140h144" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" />

  <!-- Code Review / AI Brackets Symbol -->
  <!-- Left Bracket -->
  <path d="M78 68 L56 100 L78 132" stroke="url(#gradient-bg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket -->
  <path d="M122 68 L144 100 L122 132" stroke="url(#gradient-bg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central AI Pulse / Sparkle Core -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="14" fill="url(#gradient-bg)" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <!-- AI Sparkle points -->
    <path d="M0 -22 L3 -9 L16 -6 L5 0 L16 6 L3 9 L0 22 L-3 9 L-16 6 L-5 0 L-16 -6 L-3 -9 Z" fill="#F43F5E" opacity="0.9" />
  </g>

  <!-- Pull Request Diff dots -->
  <circle cx="70" cy="100" r="3" fill="#10B981" />
  <circle cx="130" cy="100" r="3" fill="#10B981" />
</svg>
